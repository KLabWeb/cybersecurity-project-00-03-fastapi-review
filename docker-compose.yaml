services:
  uvicorn:
    build: .
    ports:
      - "${APP_PORT}:8080"
      - "5678:5678"
    environment:
      - APP_ENV=${APP_ENV}
      - "DEBUG=${DEBUG:-0}"
      - "DEBUG_WAIT=${DEBUG_WAIT:-0}"
      - "PYDEVD_DISABLE_FILE_VALIDATION=1"
    volumes:
      - ./data:/usr/local/app/data
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /usr/local/app/src
        - action: rebuild
          path: requirements.txt
