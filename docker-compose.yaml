services:
  uvicorn:
    build: .
    ports:
      - "${APP_PORT}:8080"
    environment:
      - APP_ENV=${APP_ENV}
    volumes:
      - ./data:/usr/local/app/data
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /usr/local/app/src
        - action: rebuild
          path: requirements.txt
